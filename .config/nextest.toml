# Quarto's shared Sass cache can reject concurrent writers with "database is locked".
[test-groups.quarto]
max-threads = 1

[[profile.default.overrides]]
filter = 'binary(render) | test(published_r_and_quarto_examples_execute) | test(r_version_selection_covers_render_flag_and_run_frontmatter)'
test-group = 'quarto'
